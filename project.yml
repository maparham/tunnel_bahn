name: TunnelBahn
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.tunnelbahn.mac
    SWIFT_VERSION: 5.10
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 92G3VZAPVG
    ENABLE_HARDENED_RUNTIME: YES
packages:
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    exactVersion: 0.14.1
targets:
  TunnelBahn:
    type: application
    platform: macOS
    sources:
      - path: TunnelBahn
      - path: Shared
    resources:
      - path: TunnelBahn/Resources
    settings:
      base:
        INFOPLIST_FILE: TunnelBahn/Info.plist
        CODE_SIGN_ENTITLEMENTS: TunnelBahn/TunnelBahn.entitlements
    dependencies:
      - target: PacketTunnelExtension
        embed: true
        codeSign: true
      - target: TransparentProxyExtension
        embed: true
        codeSign: true
    preBuildScripts:
      - name: Generate BuildInfo (git stamp)
        script: bash "${SRCROOT}/tools/gen-buildinfo.sh"
        basedOnDependencyAnalysis: false

  PacketTunnelExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: NetworkExtension
      - path: Shared
      - path: TunnelBahn/Models
    settings:
      base:
        DEVELOPMENT_TEAM: 92G3VZAPVG
        PRODUCT_NAME: com.tunnelbahn.mac.networkextension
        PRODUCT_BUNDLE_IDENTIFIER: com.tunnelbahn.mac.networkextension
        INFOPLIST_FILE: NetworkExtension/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: NetworkExtension/PacketTunnelExtension-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/Frameworks
        OTHER_LDFLAGS: $(inherited) -lboringtun_bridge
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: NetworkExtension/NetworkExtension.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: NetworkExtension/NetworkExtension.entitlements
    dependencies:
      - package: swift-nio-ssh
        product: NIOSSH
    preBuildScripts:
      - name: Build BoringTunBridge (universal)
        script: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET:-14.0}"
          bash "${SRCROOT}/BoringTunBridge/build.sh"
        basedOnDependencyAnalysis: false
      - name: Generate BuildInfo (git stamp)
        script: bash "${SRCROOT}/tools/gen-buildinfo.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Auto-bump build number (force sysext redeploy)
        script: bash "${SRCROOT}/tools/autobump-build-number.sh"
        basedOnDependencyAnalysis: false

  TransparentProxyExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: TransparentProxyExtension
      - path: Shared
      - path: TunnelBahn/Models
    settings:
      base:
        DEVELOPMENT_TEAM: 92G3VZAPVG
        PRODUCT_NAME: com.tunnelbahn.mac.transparentproxy
        PRODUCT_BUNDLE_IDENTIFIER: com.tunnelbahn.mac.transparentproxy
        INFOPLIST_FILE: TransparentProxyExtension/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: TransparentProxyExtension/TransparentProxyExtension-Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: TransparentProxyExtension/TransparentProxyExtension.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: TransparentProxyExtension/TransparentProxyExtension.entitlements
    preBuildScripts:
      - name: Generate BuildInfo (git stamp)
        script: bash "${SRCROOT}/tools/gen-buildinfo.sh"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Auto-bump build number (force sysext redeploy)
        script: bash "${SRCROOT}/tools/autobump-build-number.sh"
        basedOnDependencyAnalysis: false
schemes:
  TunnelBahn:
    build:
      targets:
        TunnelBahn: all
        PacketTunnelExtension: all
        TransparentProxyExtension: all
    run:
      config: Debug
      executable: TunnelBahn
      macroExpansion: PacketTunnelExtension
    profile:
      config: Release
      executable: TunnelBahn
      macroExpansion: PacketTunnelExtension
