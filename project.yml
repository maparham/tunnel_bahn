name: AppSplitWG
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.appsplit.wg
    SWIFT_VERSION: 5.10
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 92G3VZAPVG
packages:
  wireguard-apple:
    path: Vendor/wireguard-apple
targets:
  AppSplitWG:
    type: application
    platform: macOS
    sources:
      - path: AppSplitWG
      - path: Shared
    resources:
      - path: AppSplitWG/Resources
    settings:
      base:
        INFOPLIST_FILE: AppSplitWG/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppSplitWG/AppSplitWG.entitlements
    dependencies:
      - target: PacketTunnelExtension
        embed: true
        codeSign: true
      - target: TransparentProxyExtension
        embed: true
        codeSign: true

  PacketTunnelExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: NetworkExtension
      - path: Shared
      - path: AppSplitWG/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appsplit.wg.networkextension
        INFOPLIST_FILE: NetworkExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetworkExtension/NetworkExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: NetworkExtension/PacketTunnelExtension-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/Frameworks
        OTHER_LDFLAGS: $(inherited) -lboringtun_bridge
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: wireguard-apple
        product: WireGuardKit
    preBuildScripts:
      - name: Build BoringTunBridge (universal)
        script: |
          set -euo pipefail
          if [ ! -f "${SRCROOT}/Frameworks/libboringtun_bridge.a" ]; then
            bash "${SRCROOT}/BoringTunBridge/build.sh"
          fi
        basedOnDependencyAnalysis: false

  TransparentProxyExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: TransparentProxyExtension
      - path: Shared
      - path: AppSplitWG/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appsplit.wg.transparentproxy
        INFOPLIST_FILE: TransparentProxyExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: TransparentProxyExtension/TransparentProxyExtension.entitlements
schemes:
  AppSplitWG:
    build:
      targets:
        AppSplitWG: all
        PacketTunnelExtension: all
        TransparentProxyExtension: all
    run:
      config: Debug
